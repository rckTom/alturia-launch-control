<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" fill="#111">
<rect width="1200" height="570" fill="#fff"/>

<text x="40" y="62" font-size="22" font-weight="600">Zündkreis im Satelliten</text>

<!-- Leitung -->
<g stroke="#111" stroke-width="2" fill="none">
  <path d="M130,232 V200 H165 M205,200 H306 M364,200 H496 M554,200 H706 M764,200 H845 M915,200 H996 M1054,200 H1160 V290"/>
  <path d="M130,244 V290"/>
</g>

<!-- Akku -->
<g stroke="#111" fill="none">
  <line x1="110" y1="232" x2="150" y2="232" stroke-width="2"/>
  <line x1="120" y1="244" x2="140" y2="244" stroke-width="4"/>
</g>
<text x="150" y="226" font-size="13">+</text>
<text x="102" y="236" font-size="15" font-weight="600" text-anchor="end">Akku</text>
<text x="102" y="254" font-size="13" fill="#555" text-anchor="end">LiFePO4, 13 V</text>

<!-- Sicherung -->
<rect x="165" y="193" width="40" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="165" y1="200" x2="205" y2="200" stroke="#111" stroke-width="1.5"/>
<text x="185" y="184" font-size="13" fill="#555" text-anchor="middle">Sicherung</text>

<!-- Masse -->
<g stroke="#111" stroke-width="2">
  <line x1="114" y1="290" x2="146" y2="290"/><line x1="120" y1="297" x2="140" y2="297"/><line x1="126" y1="304" x2="134" y2="304"/>
  <line x1="1144" y1="290" x2="1176" y2="290"/><line x1="1150" y1="297" x2="1170" y2="297"/><line x1="1156" y1="304" x2="1164" y2="304"/>
</g>

<!-- Gruppen -->
<g fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6 4">
  <rect x="240" y="110" width="380" height="180"/>
  <rect x="640" y="110" width="480" height="180"/>
</g>
<text x="252" y="130" font-size="13" fill="#555">gemeinsam für alle Kanäle</text>
<text x="652" y="130" font-size="13" fill="#555">pro Kanal (6×)</text>

<!-- Schalter: Kontakte und Schaltstücke -->
<g stroke="#111" stroke-width="2">
  <line x1="309" y1="198" x2="364" y2="174"/>
  <line x1="499" y1="198" x2="554" y2="174"/>
  <line x1="709" y1="198" x2="764" y2="174"/>
  <line x1="999" y1="198" x2="1054" y2="174"/>
</g>
<g fill="#fff" stroke="#111" stroke-width="2">
  <circle cx="306" cy="200" r="3.5"/><circle cx="364" cy="200" r="3.5"/>
  <circle cx="496" cy="200" r="3.5"/><circle cx="554" cy="200" r="3.5"/>
  <circle cx="706" cy="200" r="3.5"/><circle cx="764" cy="200" r="3.5"/>
  <circle cx="996" cy="200" r="3.5"/><circle cx="1054" cy="200" r="3.5"/>
</g>

<!-- Zünder -->
<rect x="845" y="190" width="70" height="20" fill="#fff" stroke="#111" stroke-width="2"/>

<!-- Beschriftung -->
<g font-size="15" font-weight="600" text-anchor="middle">
  <text x="335" y="238">K2 Schlüsselrelais</text>
  <text x="525" y="238">K1 Arm-Relais</text>
  <text x="735" y="238">Highside</text>
  <text x="880" y="238">Zünder</text>
  <text x="1025" y="238">Lowside</text>
</g>
<g font-size="13" fill="#555" text-anchor="middle">
  <text x="335" y="258">Schlüsselschalter,</text>
  <text x="335" y="275">ohne Software</text>
  <text x="525" y="258">Monoflop, von der Software</text>
  <text x="525" y="275">alle 80 ms angestoßen</text>
  <text x="735" y="258">Smart-FET, strombegrenzt</text>
  <text x="735" y="275">Software, nur beim Zünden</text>
  <text x="1025" y="258">Mosfet</text>
  <text x="1025" y="275">Software, nur beim Zünden</text>
</g>

<!-- Tabelle -->
<g stroke="#111">
  <line x1="240" y1="330" x2="920" y2="330" stroke-width="1.5"/>
  <line x1="240" y1="362" x2="920" y2="362" stroke-width="1"/>
  <line x1="240" y1="492" x2="920" y2="492" stroke-width="1.5"/>
</g>
<g stroke="#ddd" stroke-width="1">
  <line x1="240" y1="402" x2="920" y2="402"/>
  <line x1="240" y1="432" x2="920" y2="432"/>
  <line x1="240" y1="462" x2="920" y2="462"/>
</g>
<g font-size="14" font-weight="600">
  <text x="248" y="352">Zustand</text>
  <g text-anchor="middle"><text x="500" y="352">K2</text><text x="620" y="352">K1</text><text x="740" y="352">Highside</text><text x="860" y="352">Lowside</text></g>
</g>
<g font-size="14">
  <text x="248" y="388">SAFE</text>
  <text x="248" y="418">Schlüssel scharf</text>
  <text x="248" y="448">ARM</text>
  <text x="248" y="478" font-weight="600">FIRE (1 s)</text>
</g>
<g font-size="14" text-anchor="middle">
  <g fill="#888"><text x="500" y="388">offen</text><text x="620" y="388">offen</text><text x="740" y="388">offen</text><text x="860" y="388">offen</text></g>
  <text x="500" y="418" font-weight="600">zu</text><g fill="#888"><text x="620" y="418">offen</text><text x="740" y="418">offen</text><text x="860" y="418">offen</text></g>
  <text x="500" y="448" font-weight="600">zu</text><text x="620" y="448" font-weight="600">zu</text><g fill="#888"><text x="740" y="448">offen</text><text x="860" y="448">offen</text></g>
  <g font-weight="600"><text x="500" y="478">zu</text><text x="620" y="478">zu</text><text x="740" y="478">zu</text><text x="860" y="478">zu</text></g>
</g>

<text x="240" y="530" font-size="14" fill="#444">Strom fließt nur, wenn alle vier Schalter geschlossen sind. Ein einzelner defekter Schalter zündet nichts.</text>
</svg>
