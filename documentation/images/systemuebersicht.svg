<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" fill="#111">
<rect width="1200" height="620" fill="#fff"/>

<text x="40" y="62" font-size="22" font-weight="600">Systemübersicht</text>

<!-- Funkstrecken -->
<g stroke="#111" stroke-width="1.5" stroke-dasharray="7 5" fill="none">
  <line x1="340" y1="290" x2="600" y2="195"/>
  <line x1="340" y1="330" x2="600" y2="415"/>
  <line x1="340" y1="350" x2="600" y2="560"/>
</g>
<text x="440" y="306" font-size="14" font-weight="600">LoRa-Funk</text>
<text x="440" y="324" font-size="13" fill="#555">869,85 MHz, verschlüsselt</text>

<!-- Controller -->
<rect x="40" y="200" width="300" height="190" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="40" y1="238" x2="340" y2="238" stroke="#111" stroke-width="1"/>
<text x="56" y="226" font-size="17" font-weight="600">Controller</text>
<g font-size="14" fill="#333">
  <text x="56" y="264">ESP32-S3, Zephyr RTOS</text>
  <text x="56" y="288">Sharp Memory Display</text>
  <text x="56" y="312">Steuerkreuz, ARM, FIRE, FILL, VENT</text>
  <text x="56" y="336">LoRa-Funkmodul</text>
  <text x="56" y="360">1S-LiPo, Laden über USB-C</text>
</g>

<!-- Satellit A -->
<rect x="600" y="100" width="320" height="190" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="600" y1="138" x2="920" y2="138" stroke="#111" stroke-width="1"/>
<text x="616" y="126" font-size="17" font-weight="600">Satellit A</text>
<g font-size="14" fill="#333">
  <text x="616" y="164">STM32G474, Zephyr RTOS</text>
  <text x="616" y="188">LoRa-Funkmodul</text>
  <text x="616" y="212">Schlüsselschalter, Arm-Relais</text>
  <text x="616" y="236">6 Pyrokanäle mit Durchgangsprüfung</text>
  <text x="616" y="260">LiFePO4-Akku 6 Ah</text>
</g>

<!-- Satellit B -->
<rect x="600" y="320" width="320" height="190" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="600" y1="358" x2="920" y2="358" stroke="#111" stroke-width="1"/>
<text x="616" y="346" font-size="17" font-weight="600">Satellit B</text>
<g font-size="14" fill="#333">
  <text x="616" y="384">STM32G474, Zephyr RTOS</text>
  <text x="616" y="408">LoRa-Funkmodul</text>
  <text x="616" y="432">Schlüsselschalter, Arm-Relais</text>
  <text x="616" y="456">6 Pyrokanäle mit Durchgangsprüfung</text>
  <text x="616" y="480">LiFePO4-Akku 6 Ah</text>
</g>

<!-- weitere Satelliten -->
<rect x="600" y="540" width="320" height="40" fill="#fff" stroke="#888" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="616" y="565" font-size="14" fill="#555">weitere Satelliten, bis zu 8 insgesamt</text>

<!-- Kanäle -->
<g stroke="#111" stroke-width="1.5">
  <line x1="920" y1="133" x2="980" y2="133"/><line x1="920" y1="158" x2="980" y2="158"/><line x1="920" y1="183" x2="980" y2="183"/>
  <line x1="920" y1="208" x2="980" y2="208"/><line x1="920" y1="233" x2="980" y2="233"/><line x1="920" y1="258" x2="980" y2="258"/>
  <line x1="920" y1="353" x2="980" y2="353"/><line x1="920" y1="378" x2="980" y2="378"/><line x1="920" y1="403" x2="980" y2="403"/>
  <line x1="920" y1="428" x2="980" y2="428"/><line x1="920" y1="453" x2="980" y2="453"/><line x1="920" y1="478" x2="980" y2="478"/>
</g>
<g fill="#fff" stroke="#111" stroke-width="1.5">
  <circle cx="983.5" cy="133" r="3.5"/><circle cx="983.5" cy="158" r="3.5"/><circle cx="983.5" cy="183" r="3.5"/>
  <circle cx="983.5" cy="208" r="3.5"/><circle cx="983.5" cy="233" r="3.5"/><circle cx="983.5" cy="258" r="3.5"/>
  <circle cx="983.5" cy="353" r="3.5"/><circle cx="983.5" cy="378" r="3.5"/><circle cx="983.5" cy="403" r="3.5"/>
  <circle cx="983.5" cy="428" r="3.5"/><circle cx="983.5" cy="453" r="3.5"/><circle cx="983.5" cy="478" r="3.5"/>
</g>
<g font-size="13" fill="#555">
  <text x="1002" y="192">6 Kanäle:</text><text x="1002" y="210">Zünder oder</text><text x="1002" y="228">Ventile</text>
  <text x="1002" y="412">6 Kanäle:</text><text x="1002" y="430">Zünder oder</text><text x="1002" y="448">Ventile</text>
</g>
</svg>
