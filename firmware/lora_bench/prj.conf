CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_HWINFO=y

CONFIG_SPI=y
CONFIG_LORA=y
# The driver logs every receive timeout at INF, which the listen loop
# would turn into four lines a second.
CONFIG_LORA_LOG_LEVEL_WRN=y

# Status on the OLED, in the app's own 5x8 font
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n

# Secure-link mode (src/secure.c): the role and the pairing live in flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_REBOOT=y

# Link security, see design/radio_security.md
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_ENTROPY_GENERATOR=y

# Reply slots are timed to the millisecond; the ESP32 default of 100 ticks
# per second would round every wait to 10 ms.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# The native SX126x driver, kept in standby between operations. It waits
# on BUSY without sleeping, so a reply goes out within a millisecond of
# its slot starting. loramac-node sleeps the chip after every call, which
# put some 40 ms of jitter-prone setup around each transmission.
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE_SLEEP=n
