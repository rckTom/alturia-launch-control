#
# mcumgr over the USB shell, for boards that boot through MCUboot. Each
# app's sysbuild.cmake adds this file when sysbuild builds MCUboot, so
# native_sim and radiosim builds stay without it.
#
# The SMP frames travel inside the shell's byte stream (shell transport):
# the browser tool keeps a terminal open on the same port and picks the
# frames out of it.

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
# The shell only picks SMP frames out of its input with an interrupt-driven
# (or async) UART; a polled shell would take them for typed text.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
# Drop a half-received frame instead of leaving the shell deaf.
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y
# Room for 512-byte upload chunks plus the CBOR around them.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=640
# The upload runs on mcumgr's work queue: image check, SHA-256 and the
# flash driver. The default 2 KB stack overflowed silently on the
# controller at the first chunk (the ESP32 flash driver is stack hungry).
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=6144
# One buffer per console frame (at most 93 bytes of packet each) until the
# shell thread takes them; with the default 2, a request of more than two
# frames loses its tail when the frames arrive back to back.
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=8

# Image management: list the slots, upload to slot 1, test, confirm.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
# mcuboot_util logs "Swap type: none" at info level on every slot query;
# on the shell port that only gets between the SMP frames.
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# Erase slot 1 as the data arrives. Otherwise the first chunk erases the
# whole slot at once: 5.9 MB on the controller, tens of seconds with the
# flash cache off, and the board dropped off USB during it.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# OS management: echo, reset, board and version info, bootloader mode,
# buffer sizes for the client.
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# Hooks the app uses to refuse uploads and resets while armed.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
