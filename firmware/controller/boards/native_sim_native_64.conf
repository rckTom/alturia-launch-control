# LVGL objects hold pointers, so on 64-bit native_sim the UI needs much
# more of LVGL's pool than on the 32-bit controller (192 KB, prj.conf).
# Check the board's use with "lvgl stats memory" in its shell.
CONFIG_LV_Z_MEM_POOL_SIZE=393216

# The emulated panel is small; show it at double size
CONFIG_SDL_DISPLAY_ZOOM_PCT=200
