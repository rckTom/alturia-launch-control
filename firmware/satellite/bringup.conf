#
# Bring-up shells: poke pins and read the ADCs from the shell
# (gpio get/set/conf/info, adc <dev> read <ch>, pwm). They cost some
# 15 KB, so they are off in the normal build to leave the app room in
# MCUboot's slots. Add them with
#   west build ... -- -Dsatellite_EXTRA_CONF_FILE=bringup.conf   (sysbuild)
#   west build ... -- -DEXTRA_CONF_FILE=bringup.conf             (without)

CONFIG_GPIO_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_PWM_SHELL=y
