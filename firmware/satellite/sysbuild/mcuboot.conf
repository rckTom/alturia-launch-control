#
# MCUboot for the satellite. It has to stay inside the 48 KB boot
# partition; the log on J2 is the minimal one from MCUboot's prj.conf.

# The app's IWDG is not running yet when MCUboot swaps, so there is
# nothing to feed; this only matters if the IWDG is ever started by the
# option bytes (IWDG_SW = 0).
CONFIG_BOOT_WATCHDOG_FEED=n
