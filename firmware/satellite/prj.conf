CONFIG_MAIN_STACK_SIZE=4096

# Diagnostics over the USB console and the UART header
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

# Peripherals the satellite drives
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
# The SPI-attached ADCs must come up after the SPI controller
CONFIG_ADC_INIT_PRIORITY=80

# LoRa link to the operator console (SX1262 / RA-01SH)
CONFIG_LORA=y
CONFIG_LORA_SHELL=n

# Key and configuration storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# USB-C provisioning path: CDC ACM for the key-loading protocol
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Launch satellite"

# Command authentication. AES-GCM for the session, HMAC-SHA256 for the
# pre-shared provisioning key, ECDSA P-256 for console identity and ECDH
# for the button-pairing path.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# TRNG for nonces and session keys
CONFIG_ENTROPY_GENERATOR=y
