CONFIG_MAIN_STACK_SIZE=4096

# Diagnostics over the USB console and the UART header
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

# Peripherals the satellite drives
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
# The SPI-attached ADCs must come up after the SPI controller
CONFIG_ADC_INIT_PRIORITY=80

# LoRa link to the operator console (SX1262 / RA-01SH)
CONFIG_LORA=y
CONFIG_LORA_SHELL=n

# Key and configuration storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# Console over USB-C (CDC ACM). Keys are no longer loaded this way: the
# satellite pairs with the console over LoRa, see design/radio_security.md.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Launch satellite"

# Link security (../common/link, design/radio_security.md): ECDH P-256 for
# pairing, HMAC/HKDF-SHA256 for commitments and key derivation, AES-128-CCM
# for every frame.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# Satellite identity for pairing, and the pairing button
CONFIG_HWINFO=y
CONFIG_INPUT=y

# TRNG for nonces and session keys
CONFIG_ENTROPY_GENERATOR=y
