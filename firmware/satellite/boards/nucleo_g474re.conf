# Hardware of the satellite board (here the Nucleo with the SX1262 shield)
# that native_sim does not have; see boards/native_sim_native_64.conf for that one.

# LoRa link to the operator console (SX1262 / RA-01SH)
CONFIG_LORA=y
CONFIG_LORA_SHELL=n

# Console over USB-C (CDC ACM). Keys are no longer loaded this way: the
# satellite pairs with the console over LoRa, see design/radio_security.md.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Launch satellite"

# The native SX126x driver, kept in standby between operations. It waits
# on BUSY without sleeping, so a reply goes out within a millisecond of
# its slot starting. loramac-node sleeps the chip after every call, which
# put some 40 ms of jitter-prone setup around each transmission.
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE_SLEEP=n
