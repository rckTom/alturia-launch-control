# The real satellite board (firmware/boards/others/alturia_satellite). The console
# and shell are on USB-C; the board turns on the CDC ACM backend.

# LoRa link to the operator console (Wio-SX1262)
CONFIG_LORA=y
CONFIG_LORA_SHELL=n

# The native SX126x driver, kept in standby between operations. It waits
# on BUSY without sleeping, so a reply goes out within a millisecond of
# its slot starting. loramac-node sleeps the chip after every call, which
# put some 40 ms of jitter-prone setup around each transmission.
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE_SLEEP=n

CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Launch satellite"

# Start-up chime on the PWM buzzer
CONFIG_BUZZER=y

# Same timer resolution as the controller: slot timing is in 100 us.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Bring-up: poke pins and read the ADCs from the shell
# (gpio get/set/conf/info, adc <dev> read <ch>).
CONFIG_GPIO_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_PWM_SHELL=y
# kernel reboot
CONFIG_REBOOT=y

# The USB console is the shell, so logs have to go through it; without
# this they go nowhere on this board.
CONFIG_SHELL_LOG_BACKEND=y
