# The satellite as a node of the radio network simulator (tools/radiosim):
# the link runs over common/lora/radio_sim.c, the pyro outputs, LEDs and
# the pairing button are emulated GPIOs, the ADCs emulated ADCs, and the
# console is the native_sim UART.
CONFIG_GPIO_EMUL=y
CONFIG_ADC_EMUL=y
CONFIG_SERIAL=y

# Same timer resolution as the controller: slot timing is in 100 us.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
