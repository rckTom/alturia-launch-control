# The controller as a node of the radio network simulator (tools/radiosim):
# the real link over the simulated radio (common/lora/radio_sim.c) instead
# of the in-process satellite simulator. Build with
#   -DEXTRA_CONF_FILE=radiosim.conf -DEXTRA_DTC_OVERLAY_FILE=radiosim.overlay
CONFIG_APP_SAT_SIM=n
CONFIG_GPIO_EMUL=y
# The controller's net_id and a satellite's uid in the simulator's list
CONFIG_HWINFO=y
