# The real controller board (firmware/boards/others/alturia_controller).
# The console and shell are on USB-C (USB Serial/JTAG).

# The LoRa link instead of the in-process satellite simulator (Wio-SX1262)
CONFIG_APP_SAT_SIM=n
CONFIG_LORA=y
CONFIG_LORA_SHELL=n

# The native SX126x driver, kept in standby between operations, as on the
# satellite (see firmware/satellite/boards/alturia_satellite.conf).
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE_SLEEP=n

# Own battery: MAX17048 fuel gauge and BQ24296M charger on I2C
CONFIG_I2C=y
CONFIG_FUEL_GAUGE=y
CONFIG_CHARGER=y

# Start-up chime on the PWM buzzer
CONFIG_BUZZER=y

# Light sleep whenever every thread waits (src/sleep.c). The RTC timer
# wakes it for timeouts, the keys, LORA_DIO1 and USB_PGOOD for events.
CONFIG_PM=y
CONFIG_COUNTER=y
# Only for the RTC timer's wakeup-source, which the SoC code checks. The
# devices must not be suspended around each sleep: gpio-keys would mask
# the very interrupts that wake it.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n

# Bring-up: poke pins from the shell (gpio get/set/conf/info)
CONFIG_GPIO_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_REBOOT=y

# The USB console is the shell, so logs have to go through it.
CONFIG_SHELL_LOG_BACKEND=y
