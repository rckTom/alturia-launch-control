CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_SHELL=y

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
# The emulated panel is small; show it at double size
CONFIG_SDL_DISPLAY_ZOOM_PCT=200
CONFIG_INPUT=y
# No touch: all input comes from physical controls
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=n
CONFIG_GPIO=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=196608
CONFIG_LV_Z_SHELL=y
CONFIG_LV_USE_LOG=y
# 1-bit Sharp Memory LCD class panel
CONFIG_LV_COLOR_DEPTH_1=y
# Fix inverted (white on black) text in 1-bit rendering, see src/lvgl/i1_blend_fix.h
CONFIG_LV_DRAW_SW_ASM_CUSTOM=y
CONFIG_LV_DRAW_SW_ASM_CUSTOM_INCLUDE="i1_blend_fix.h"
# UI fonts are generated, see src/fonts/gen.sh; this is only LVGL's default
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
# Keep hyphenated words like E-STOP together when wrapping
CONFIG_LV_TXT_BREAK_CHARS=" ,.;:_)}"
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_SHELL_LOG_BACKEND=n

# Persistent configuration (pad labels) on the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_SHELL=y

# Secure LoRa link, see design/radio_security.md: ECDH P-256 pairing,
# HMAC/HKDF-SHA256, AES-128-CCM frames
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_ENTROPY_GENERATOR=y

# Reply slots are timed to the millisecond; the ESP32 default of 100 ticks
# per second would round every wait to 10 ms.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
